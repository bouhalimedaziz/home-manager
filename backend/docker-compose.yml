services:
  db:
    image: postgres:16-alpine
    container_name: home-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: home_manager
      POSTGRES_USER: home_manager
      POSTGRES_PASSWORD: home_manager
    ports:
      - "5432:5432"
    volumes:
      - home_manager_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_manager -d home_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-manager-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Standard Spring Boot relaxed-binding env vars — nothing in
      # application.yaml needs to change for these to take effect.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/home_manager
      SPRING_DATASOURCE_USERNAME: home_manager
      SPRING_DATASOURCE_PASSWORD: home_manager
      # Comma-separated list read by SecurityConfig's CORS bean.
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8080:8080"

volumes:
  home_manager_db_data:
